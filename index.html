.header {

}

.header h1 {

.date {

.card {

.goal {

.goal-title {

}

.number {

}

.progress {

    text-align: center;

}

button {
    width: 100%;

}

button.done {
    background: #ddd;
    color: #666;
}

.message-title {
    font-weight: 700;
    margin-bottom: 10px;
}

.message {
    background: #f5f5f5;
    border-radius: 14px;
    padding: 16px;
    line-height: 1.6;
}

.history-title {
    font-weight: 700;
    margin-bottom: 14px;
}

.day {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.day:last-child {
    border-bottom: none;
}

.ok {
    font-weight: 700;
}

.no {
    color: #aaa;
}

.footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 25px;
}
</style>
