<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 今日背词</title>

<style>
body{
    margin:0;
    background:#f7f7f7;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#222;
}

.box{
    max-width:500px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

h1{
    font-size:28px;
}

.number{
    font-size:42px;
    font-weight:bold;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    background:#222;
    color:white;
    font-size:17px;
}

.done{
    background:#ddd;
    color:#666;
}
</style>
</head>

<body>

<div class="box">

<div class="card">
    <div style="font-size:40px;">❤️</div>
    <h1>今日背词</h1>
    <p id="date"></p>
</div>

<div class="card">
    <p>今日目标</p>
    <div class="number">30</div>
    <p>个单词</p>

    <button id="btn" onclick="checkIn()">
        我已经背完啦 ✅
    </button>
</div>

<div class="card">
    <h3>💌 监督员留言</h3>
    <p>今天也要好好背哦！</p>
    <p>不许偷懒，30 个单词而已，加油 ❤️</p>
</div>

</div>

<script>

const now = new Date();

document.getElementById("date").innerText =
    now.getFullYear() + "年" +
    (now.getMonth()+1) + "月" +
    now.getDate() + "日";

function checkIn(){

    localStorage.setItem("checked","yes");

    const btn = document.getElementById("btn");

    btn.innerText = "今日已完成 ❤️";
    btn.className = "done";
}

if(localStorage.getItem("checked") === "yes"){

    document.getElementById("btn").innerText =
        "今日已完成 ❤️";

    document.getElementById("btn").className =
        "done";
}

</script>

</body>
</html>
