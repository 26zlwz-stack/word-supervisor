<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 今日背词</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f7f7f7;
    color: #222;
}

.container {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 18px 40px;
}

.header {
    text-align: center;
    padding: 20px 0;
}

.heart {
    font-size: 42px;
}

h1 {
    margin: 8px 0 5px;
    font-size: 27px;
}

.date {
    color: #888;
    font-size: 14px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-top: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.05);
}

.goal {
    text-align: center;
}

.goal-title {
    color: #777;
    font-size: 15px;
}

.number {
    font-size: 42px;
    font-weight: 700;
    margin: 8px 0;
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin: 15px 0;
}

.progress-bar {
    width: 100%;
    height: 100%;
    background: #222;
}

.streak {
    text-align: center;
    font-size: 18px;
    margin-top: 14px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 18px;
    background: #222;
    color: white;
}

button.done {
    background: #ddd;
    color: #666;
}

.message-title,
.history-title {
    font-weight: 700;
    margin-bottom: 12px;
}

.message {
    background: #f5f5f5;
    border-radius: 14px;
    padding: 16px;
    line-height: 1.6;
}

.day {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.day:last-child {
    border-bottom: none;
}

.ok {
    font-weight: 700;
}

.no {
    color: #aaa;
}

.footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="heart">❤️</div>
        <h1>今日背词</h1>
        <div class="date" id="date"></div>
    </div>

    <div class="card goal">

        <div class="goal-title">今日目标</div>

        <div class="number">30</div>

        <div>个单词</div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <div class="streak">
            🔥 连续打卡 <strong id="streak">0</strong> 天
        </div>

        <button id="checkButton" onclick="checkIn()">
            我已经背完啦 ✅
        </button>

    </div>

    <div class="card">

        <div class="message-title">
            💌 监督员留言
        </div>

        <div class="message">
            今天也要好好背哦！<br>
            不许偷懒，30 个单词而已，加油 ❤️
        </div>

    </div>

    <div class="card">

        <div class="history-title">
            📅 最近 7 天
        </div>

        <div id="history"></div>

    </div>

    <div class="footer">
        ❤️ 好好背单词，天天进步
    </div>

</div>

<script>

function getDateString(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
}

const today = new Date();
const todayString = getDateString(today);

document.getElementById("date").innerText =
    today.getFullYear() + "年" +
    (today.getMonth() + 1) + "月" +
    today.getDate() + "日";


function getRecords() {
    return JSON.parse(localStorage.getItem("wordRecords") || "{}");
}


function checkIn() {

    const records = getRecords();

    if (records[todayString]) {
        return;
    }

    records[todayString] = true;

    localStorage.setItem(
        "wordRecords",
        JSON.stringify(records)
    );

    updatePage();
}


function calculateStreak(records) {

    let streak = 0;
    let date = new Date();

    while (true) {

        const key = getDateString(date);

        if (!records[key]) {
            break;
        }

        streak++;

        date.setDate(date.getDate() - 1);
    }

    return streak;
}


function updatePage() {

    const records = getRecords();

    const button =
        document.getElementById("checkButton");

    const streak =
        document.getElementById("streak");

    if (records[todayString]) {

        button.innerText = "今日已完成 ❤️";
        button.classList.add("done");

    } else {

        button.innerText = "我已经背完啦 ✅";
        button.classList.remove("done");

    }

    streak.innerText =
        calculateStreak(records);

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    for (let i = 0; i < 7; i++) {

        const date = new Date();

        date.setDate(
            date.getDate() - i
        );

        const key = getDateString(date);

        let label;

        if (i === 0) {
            label = "今天";
        } else if (i === 1) {
            label = "昨天";
        } else if (i === 2) {
            label = "前天";
        } else {
            label = i + " 天前";
        }

        const row =
            document.createElement("div");

        row.className = "day";

        const left =
            document.createElement("span");

        left.innerText = label;

        const right =
            document.createElement("span");

        if (records[key]) {

            right.innerText = "✅ 已完成";
            right.className = "ok";

        } else {

            right.innerText = "未完成";
            right.className = "no";

        }

        row.appendChild(left);
        row.appendChild(right);

        history.appendChild(row);
    }
}


updatePage();

</script>

</body>
</html>
